[uwsgi]
module = webclient.wsgi:application

master = true
processes = 15
enable-threads = false

uid = user
gid = user

socket = :8000
http-socket = :8001
chmod-socket = 660
vacuum = true

die-on-term = true
stats = /tmp/stats.socket
listen = 1024

thunder-lock = true
max-requests = 5000

buffer-size = 65535

# Pojistka proti nečinné DB transakci, např. při zaseknutém požadavku do Fedory (#4454).
# 70 min je nad FEDORA_CONTENT_READ_TIMEOUT (1 h): worker po vypršení nginx (600 s) pokračuje dál a DB spojení
# se nesmí zavřít dřív, než doběhne nebo vyprší zápis do Fedory, jinak by Fedora a DB skončily v rozporu.
env = DB_IDLE_IN_TRANSACTION_SESSION_TIMEOUT=4200000
