# Optional repository facts for aiscr-review-translations.
# Prefer existing project configuration; no declaration or native pipeline is required.
# A run may record these facts in its context JSON instead. Uncomment only established
# facts: example limits and domain conventions do not apply to every repository.

# Runtime-built key families are protected when a separate migration is approved.
runtime_key_families = []

[context]
# languages = ["en", "de"]
# format = "ngx"
# placeholder_grammar = "named"
# key_convention = "Established repository convention and its source"
# style_profile = "established-profile"  # only when that profile applies

[catalogues]
# en = "src/assets/i18n/en.json"
# de = "src/assets/i18n/de.json"

[authority]
# domain = "Domain name"  # that domain's authoritative catalogue and glossary remain binding
# evidence = "Local catalogue/extract or an acquisition receipt for the selected terms"
# languages = ["en", "de"]

[conventions]
# source = "Repository style guide / affected caller inspection"
# interpolation = "Existing safe formatter; do not substitute another stack's helper"

[check_coverage]
# source = "Supported syntax and dynamic-reference limits, with method and scoped keys"
# build = "Existing command and the coverage actually demonstrated"
# rendering = "Browser/test evidence, or explicitly unavailable"

# A removal (a rename's old key or a proven-dead key) and inline proposals are run-context
# fields, not declaration fields. Record them in the context JSON:
#   proposed_texts = { en = { "message.key" = "Value" } }
#   removals = [{ key = "old.key", reason = "renamed to new.key", unused = "no remaining caller" }]

[exceptions]
# "message.key" = "Context differs from the domain authority, with evidence"

[placeholder_texts]
# "message.key" = ["count"]

[envelopes]
# "message.key" = ["name", "count"]  # inspected caller inputs, not inferred from text

[limits]
# button = { en = 24, de = 30 }  # established UI limits, reported as review signals
