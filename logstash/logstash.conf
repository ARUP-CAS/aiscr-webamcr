# Heslo ES_PASSWORD dosazuje entrypoint kontejneru ze swarm secretu logstash_elastic_pass (viz docker-compose*.yml).
input {
    tcp {
        port => 5959
        codec => json
    }
}

output {
    elasticsearch {
        hosts => ["elasticsearch:9200"]
        user => "amcr_logger"
        password => "${ES_PASSWORD}"
        index => "amcr"
        # op_type=create: role amcr_logger má jen create_doc, výchozí akce index (přepis) by skončila 403.
        action => "create"
        # Šablona amcr_template a ILM politika se spravují ručně; účet amcr_logger na ně nemá práva.
        manage_template => false
        ilm_enabled => false
    }
}
