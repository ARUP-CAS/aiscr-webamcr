name: Pre-commit

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
      - test
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: "Checks; dependency docs without upgrades; or pin refresh with dependency docs"
        type: choice
        required: true
        default: docs
        options:
          - checks
          - docs
          - refresh
      bypass_docstring_exclusions:
        description: "Bypass file/class/method exclusions in docstring reminder hook"
        type: boolean
        default: false

permissions:
  pull-requests: write

concurrency:
  group: pre-commit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    # Požadovaný check existuje i pro vyloučenou automatiku; gate vypíše důvod.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Decide pre-commit mode
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE: ${{ github.base_ref }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          mode=checks
          reason="Standard checks for a development PR."

          # Opravné PR nesmějí založit další opravné PR; Dependabot je mimo tento CI.
          case "$BRANCH" in
            dependabot/* | pre-commit-fixes/* | deps/python-pins-refresh)
              mode=none
              reason="Excluded automation source branch."
              ;;
          esac
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            mode=none
            reason="Dependabot PRs are outside this CI."
          fi
          # Zahrnuje release App: CITATION push probíhá uvnitř release, bez následného fix PR.
          case "$ACTOR" in
            *'[bot]')
              mode=none
              reason="Bot-triggered automation is excluded, including release citation pushes."
              ;;
          esac

          if [ "$mode" != "none" ]; then
            if { [ "$EVENT_NAME" = "pull_request" ] && [ "$BASE" = "main" ]; } || \
               { [ "$EVENT_NAME" = "push" ] && [ "$BRANCH" = "main" ]; }; then
              mode=refresh
              reason="Refresh pins and dependency documentation for main."
            elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              case "${MANUAL_MODE:-docs}" in
                checks | docs | refresh) mode="${MANUAL_MODE:-docs}" ;;
                *) echo "::error::Unknown manual mode."; exit 1 ;;
              esac
              reason="Selected manual mode: $mode."
            fi
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = "none" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$mode" = "docs" ] || [ "$mode" = "refresh" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
          printf 'Mode: %s\n%s\n' "$mode" "$reason" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout source commit
        id: checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        id: python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pre-commit
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Cache pip
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('webclient/requirements*.txt', '.pre-commit-config.yaml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Configure git
        if: steps.gate.outputs.run == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Refresh i docs čtou stejné .txt; přímé autorské piny v .in se nemění.
      - name: Compile or refresh Python requirements
        id: compile
        if: steps.gate.outputs.run == 'true'
        env:
          RUN_MODE: ${{ steps.gate.outputs.mode }}
        run: |
          if [ "$RUN_MODE" = "refresh" ]; then
            bash scripts/compile_requirements.sh --upgrade
          else
            bash scripts/compile_requirements.sh
          fi

      - name: Install dependencies
        id: install
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pip-licenses
          pip install -r webclient/requirements-dev.txt -r webclient/requirements-docs.txt

      - name: Test pre-commit workflow and reports
        id: tests
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest discover -s scripts -p 'test_pre_commit*.py' -v

      - name: Run convert_to_rst.py
        id: docs
        if: steps.gate.outputs.full == 'true'
        run: python docs/licenses/convert_to_rst.py

      - name: Run pre-commit
        id: hooks
        if: steps.gate.outputs.run == 'true'
        env:
          DOCSTRING_CHECK_BYPASS_EXCLUSIONS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bypass_docstring_exclusions == 'true' || 'false' }}
        run: |
          set +e

          pre-commit run --all-files 2>&1 | tee precommit.log
          EXIT_CODE=${PIPESTATUS[0]}

          sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' precommit.log | tr -d '\r' > precommit.clean.log

          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

          # Náhodný oddělovač víceřádkových výstupů: řádek logu nesmí výstup ukončit a podvrhnout další.
          DELIM="EOF_$(openssl rand -hex 16)"

          TOTAL_DOC_WARNINGS=$(grep -c -E "DOC[0-9][0-9][0-9]" precommit.clean.log || true)

          DOC_WARNINGS=$(grep -E "DOC[0-9][0-9][0-9]" precommit.clean.log | head -n 200 || true)

          if [ "$TOTAL_DOC_WARNINGS" -gt 200 ]; then
            DOC_WARNINGS="${DOC_WARNINGS}
          ...
          (Zobrazeno prvních 200 z ${TOTAL_DOC_WARNINGS} záznamů)"
          fi

          echo "doc_warnings<<${DELIM}" >> "$GITHUB_OUTPUT"
          echo "$DOC_WARNINGS" >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

          echo "log_warnings<<${DELIM}" >> "$GITHUB_OUTPUT"
          grep -Ei "(^warning:|::warning::| WARN )" precommit.clean.log \
            | grep -Evi "warning DOC[0-9][0-9][0-9]" \
            | sort -u >> "$GITHUB_OUTPUT" || true
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

          echo "flake_errors<<${DELIM}" >> "$GITHUB_OUTPUT"
          grep -E "^[^ ]+:[0-9]+:[0-9]+: [A-Z][0-9]{3}" precommit.clean.log >> "$GITHUB_OUTPUT" || true
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

          echo "image_parity_log<<${DELIM}" >> "$GITHUB_OUTPUT"
          grep '^\[image-ref-parity\]' precommit.clean.log >> "$GITHUB_OUTPUT" || true
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

          echo "npm_vendor_log<<${DELIM}" >> "$GITHUB_OUTPUT"
          grep -E '^\[(npm-vendor-names|static-vendor)\]' precommit.clean.log >> "$GITHUB_OUTPUT" || true
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

          grep -E "^[^ ]+:[0-9]+:[0-9]+: [A-Z][0-9]{3}" precommit.clean.log | while read line; do
            FILE=$(echo "$line" | cut -d: -f1)
            LINE=$(echo "$line" | cut -d: -f2)
            COL=$(echo "$line" | cut -d: -f3)
            MSG=$(echo "$line" | cut -d: -f4-)
            echo "::error file=$FILE,line=$LINE,col=$COL::$MSG"
          done || true

          echo "log_tail<<${DELIM}" >> "$GITHUB_OUTPUT"
          tail -n 80 precommit.clean.log >> "$GITHUB_OUTPUT" || true
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

          exit 0

      - name: Stage generated changes
        id: stage
        if: steps.gate.outputs.run == 'true'
        run: git add --all

      # Snapshot indexu zůstane v RUNNER_TEMP i po commitu. Text hooků vstupuje pouze přes env.
      - name: Capture staged changes and check results
        id: capture
        if: always() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success'
        env:
          RUN_MODE: ${{ steps.gate.outputs.mode }}
          FIX_DESTINATION: ${{ github.head_ref || github.ref_name }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          DOCS_OUTCOME: ${{ steps.docs.outcome }}
          HOOKS_OUTCOME: ${{ steps.hooks.outcome }}
          STAGE_OUTCOME: ${{ steps.stage.outcome }}
          HOOK_EXIT_CODE: ${{ steps.hooks.outputs.exit_code }}
          LOG_WARNINGS: ${{ steps.hooks.outputs.log_warnings }}
          DOC_WARNINGS: ${{ steps.hooks.outputs.doc_warnings }}
          FLAKE_ERRORS: ${{ steps.hooks.outputs.flake_errors }}
          IMAGE_PARITY_LOG: ${{ steps.hooks.outputs.image_parity_log }}
          NPM_VENDOR_LOG: ${{ steps.hooks.outputs.npm_vendor_log }}
        run: python scripts/pre_commit_report.py capture --record "$RUNNER_TEMP/precommit-report.json"

      - name: Prepare fix PR description
        if: steps.capture.outputs.changed == 'true'
        run: python scripts/pre_commit_report.py render --record "$RUNNER_TEMP/precommit-report.json" --output-dir "$RUNNER_TEMP/precommit-report"

      # App token spouští kontroly opravných PR; jejich vlastní pre-commit gate je no-op.
      - name: Log-in as AMCR app
        if: steps.capture.outputs.changed == 'true'
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.AISCR_AMCR_ACTIONS_CLIENT_ID }}
          private-key: ${{ secrets.AISCR_AMCR_ACTIONS_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Publish fix branch and PR
        id: publish
        if: steps.capture.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BASE: ${{ github.head_ref || github.ref_name }}
          FIX_BRANCH: pre-commit-fixes/${{ github.event.pull_request.number || github.ref_name }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git checkout -B "$FIX_BRANCH"
          # Nic dalšího se nestaguje: commit přesně odpovídá zachycenému indexu.
          git commit -m "chore: apply CI fixes and update dependency documentation"
          gh auth setup-git
          git push --force origin "$FIX_BRANCH"

          if [ "$IS_PR" = "true" ]; then
            title="Pre-commit fixes for PR #${PR_NUMBER}"
          else
            title="Pre-commit fixes for commit ${SOURCE_SHA:0:7}"
          fi

          pr_number="$(gh pr list --head "$FIX_BRANCH" --base "$BASE" --repo "$GITHUB_REPOSITORY" --json number --jq '.[0].number')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "$title" --body-file "$RUNNER_TEMP/precommit-report/fix-pr-body.md"
          else
            gh pr create --base "$BASE" --head "$FIX_BRANCH" \
              --title "$title" --body-file "$RUNNER_TEMP/precommit-report/fix-pr-body.md" \
              --label pre-commit --assignee "$ACTOR"
          fi
          pr_url="$(gh pr view "$FIX_BRANCH" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          printf 'url=%s\n' "$pr_url" >> "$GITHUB_OUTPUT"

      - name: Publish workflow summary
        id: reports
        if: always() && steps.capture.outcome == 'success'
        env:
          APP_OUTCOME: ${{ steps.app-token.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          FIX_PR_URL: ${{ steps.publish.outputs.url }}
        run: |
          python scripts/pre_commit_report.py render --record "$RUNNER_TEMP/precommit-report.json" --output-dir "$RUNNER_TEMP/precommit-report"
          cat "$RUNNER_TEMP/precommit-report/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on original PR (sticky)
        if: always() && steps.reports.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          REPORT_COMMENT_FILE: ${{ runner.temp }}/precommit-report/pr-comment.md
        with:
          script: |
            const body = require("fs").readFileSync(process.env.REPORT_COMMENT_FILE, "utf8");
            const marker = "<!-- precommit-bot-comment -->";
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            };
            const comments = await github.paginate(github.rest.issues.listComments, params);
            const existing = comments.find(
              c => c.user?.type === "Bot" && c.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: params.owner,
                repo: params.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ ...params, body });
            }

      - name: Fail if processing, publication, or checks failed
        if: always() && steps.capture.outcome == 'success'
        run: python scripts/pre_commit_report.py check --record "$RUNNER_TEMP/precommit-report.json"
