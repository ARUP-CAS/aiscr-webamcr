name: Pre-commit

on:
  pull_request:
    branches:
      - main
      - test
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dependencies:
        description: "Update the list of dependencies"
        type: boolean
        default: true
      bypass_docstring_exclusions:
        description: "Bypass file/class/method exclusions in docstring reminder hook"
        type: boolean
        default: false
      upgrade_python_pins:
        description: "Refresh compiled Python pins on test (opens/updates a PR into test)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pre-commit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    # Job-level `if` by ponechal požadovaný check ve stavu skipped, který ruleset vyhodnocuje
    # jako nesplněný (PR zůstane BLOCKED). Job proto běží vždy a vlastní práci řídí krok `gate`.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Decide pre-commit mode
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          # Pro pull_request je github.ref_name "<číslo>/merge"; zdrojovou větev nese github.head_ref.
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE: ${{ github.base_ref }}
          DEPENDENCIES: ${{ github.event.inputs.dependencies }}
        run: |
          # none     = automatické větve (opravné PR, refresh pinů) nebo bot aktér - žádné hooky
          # standard = vývojové PR - běžné hooky
          # full     = cokoliv mířící do main (PR do main i push do main) - běžné hooky
          #            navíc s regenerací dokumentace závislostí; ruční dispatch je full
          #            jen se zapnutým vstupem dependencies
          mode=standard

          case "$BRANCH" in
            pre-commit-fixes/* | deps/python-pins-refresh) mode=none ;;
          esac

          # Jakýkoliv bot (github-actions[bot], dependabot[bot], App) je automatika - žádné hooky.
          case "$ACTOR" in
            *'[bot]') mode=none ;;
          esac

          if [ "$mode" != "none" ]; then
            if [ "$EVENT_NAME" = "pull_request" ] && [ "$BASE" = "main" ]; then
              mode=full
            elif [ "$EVENT_NAME" = "push" ] && [ "$BRANCH" = "main" ]; then
              mode=full
            elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DEPENDENCIES" = "true" ]; then
              mode=full
            fi
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = "none" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$mode" = "full" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pre-commit
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Cache pip
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('webclient/requirements*.txt', '.pre-commit-config.yaml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Configure git
        if: steps.gate.outputs.run == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Kontrola synchronizace: requirements*.txt musí odpovídat autorským requirements*.in.
      # Bez --upgrade, takže PR nepřebírá nesouvisející aktualizace; případné rozdíly
      # skončí v auto-fix PR níže. Obnovu tranzitivních pinů dělá job refresh-python-pins.
      - name: Compile Python requirements
        if: steps.gate.outputs.run == 'true'
        run: bash scripts/compile_requirements.sh

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pip-licenses
          # dev obsahuje prod + test + dev, docs obsahuje prod + docs.
          pip install -r webclient/requirements-dev.txt -r webclient/requirements-docs.txt

      - name: Run convert_to_rst.py
        # Plný běh (full) regeneruje dokumentaci závislostí.
        if: steps.gate.outputs.full == 'true'
        run: python docs/licenses/convert_to_rst.py

      - name: Run pre-commit
        id: hooks
        if: steps.gate.outputs.run == 'true'
        env:
          DOCSTRING_CHECK_BYPASS_EXCLUSIONS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bypass_docstring_exclusions == 'true' || 'false' }}
        run: |
          set +e

          pre-commit run --all-files 2>&1 | tee precommit.log
          EXIT_CODE=${PIPESTATUS[0]}

          sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' precommit.log | tr -d '\r' > precommit.clean.log

          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

          # Náhodný oddělovač víceřádkových výstupů: řádek logu nesmí výstup ukončit a podvrhnout další.
          DELIM="EOF_$(openssl rand -hex 16)"

          TOTAL_DOC_WARNINGS=$(grep -c -E "DOC[0-9][0-9][0-9]" precommit.clean.log || true)

          DOC_WARNINGS=$(grep -E "DOC[0-9][0-9][0-9]" precommit.clean.log | head -n 200 || true)

          if [ "$TOTAL_DOC_WARNINGS" -gt 200 ]; then
            DOC_WARNINGS="${DOC_WARNINGS}
          ...
          (Zobrazeno prvních 200 z ${TOTAL_DOC_WARNINGS} záznamů)"
          fi

          echo "doc_warnings<<${DELIM}" >> "$GITHUB_OUTPUT"
          echo "$DOC_WARNINGS" >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

          echo "log_warnings<<${DELIM}" >> "$GITHUB_OUTPUT"
          grep -Ei "(^warning:|::warning::| WARN )" precommit.clean.log \
            | grep -Evi "warning DOC[0-9][0-9][0-9]" \
            | sort -u >> "$GITHUB_OUTPUT" || true
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

          echo "flake_errors<<${DELIM}" >> "$GITHUB_OUTPUT"
          grep -E "^[^ ]+:[0-9]+:[0-9]+: [A-Z][0-9]{3}" precommit.clean.log >> "$GITHUB_OUTPUT" || true
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

          echo "image_parity_log<<${DELIM}" >> "$GITHUB_OUTPUT"
          grep '^\[image-ref-parity\]' precommit.clean.log >> "$GITHUB_OUTPUT" || true
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

          echo "npm_vendor_log<<${DELIM}" >> "$GITHUB_OUTPUT"
          grep -E '^\[(npm-vendor-names|static-vendor)\]' precommit.clean.log >> "$GITHUB_OUTPUT" || true
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

          grep -E "^[^ ]+:[0-9]+:[0-9]+: [A-Z][0-9]{3}" precommit.clean.log | while read line; do
            FILE=$(echo "$line" | cut -d: -f1)
            LINE=$(echo "$line" | cut -d: -f2)
            COL=$(echo "$line" | cut -d: -f3)
            MSG=$(echo "$line" | cut -d: -f4-)
            echo "::error file=$FILE,line=$LINE,col=$COL::$MSG"
          done || true

          echo "log_tail<<${DELIM}" >> "$GITHUB_OUTPUT"
          tail -n 80 precommit.clean.log >> "$GITHUB_OUTPUT" || true
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

          exit 0

      - name: Check for file changes
        id: changes
        if: steps.gate.outputs.run == 'true'
        run: |
          git update-index -q --refresh
          if ! git diff-index --quiet HEAD -- || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute short SHA
        id: vars
        if: steps.gate.outputs.run == 'true'
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # PR zakládá GitHub App token, aby jeho události spouštěly navazující workflows
      # (GITHUB_TOKEN vytvořené PR běhy nespouští).
      - name: Log-in as AMCR app
        if: steps.gate.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.AISCR_AMCR_ACTIONS_CLIENT_ID }}
          private-key: ${{ secrets.AISCR_AMCR_ACTIONS_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Publish fix branch and PR
        if: steps.gate.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BASE: ${{ github.head_ref || github.ref_name }}
          FIX_BRANCH: pre-commit-fixes/${{ github.event.pull_request.number || github.ref_name }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA_SHORT: ${{ steps.vars.outputs.sha_short }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git checkout -B "$FIX_BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "chore: apply pre-commit fixes and update licenses"
          gh auth setup-git
          git push --force origin "$FIX_BRANCH"

          if [ "$IS_PR" = "true" ]; then
            title="Pre-commit fixes for PR #${PR_NUMBER}"
          else
            title="Pre-commit fixes for commit ${SHA_SHORT}"
          fi

          cat > "${RUNNER_TEMP}/fix-pr-body.md" <<'EOF'
          This PR was automatically generated by CI.

          It includes:
          - Pre-commit formatting fixes
          - Recompiled `webclient/requirements*.txt` (when they were out of sync with `requirements*.in`)
          - Container image / compose alignment (when the parity hook applied changes)
          - NPM vendor names in `base.py` (when the npm-vendor hook applied changes)
          - Updated `python_knihovny.rst`

          Please merge this PR to make the original PR pass.
          EOF

          pr_number="$(gh pr list --head "$FIX_BRANCH" --repo "$GITHUB_REPOSITORY" --json number --jq '.[0].number')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "$title" --body-file "${RUNNER_TEMP}/fix-pr-body.md"
          else
            gh pr create --base "$BASE" --head "$FIX_BRANCH" \
              --title "$title" --body-file "${RUNNER_TEMP}/fix-pr-body.md" \
              --label pre-commit --assignee "$ACTOR"
          fi

      - name: Publish workflow summary
        if: steps.gate.outputs.run == 'true'
        # Výstupy hooků obsahují text z PR (cesty, hlášky validátorů) — do shellu jen přes env,
        # nikdy přímou interpolací ${{ }} do run: (command injection).
        env:
          EXIT_CODE: ${{ steps.hooks.outputs.exit_code }}
          CHANGED: ${{ steps.changes.outputs.changed }}
          LOG_WARNINGS: ${{ steps.hooks.outputs.log_warnings }}
          DOC_WARNINGS: ${{ steps.hooks.outputs.doc_warnings }}
          FLAKE_ERRORS: ${{ steps.hooks.outputs.flake_errors }}
          IMAGE_PARITY_LOG: ${{ steps.hooks.outputs.image_parity_log }}
          NPM_VENDOR_LOG: ${{ steps.hooks.outputs.npm_vendor_log }}
        run: |
          section() {
            # $1 = nadpis, $2 = obsah; prázdný obsah sekci vynechá
            if [ -n "$2" ]; then
              printf '### %s\n```\n%s\n```\n' "$1" "$2"
            fi
          }

          if [ "$EXIT_CODE" = "0" ] && [ "$CHANGED" != "true" ] && \
             [ -z "$LOG_WARNINGS" ] && [ -z "$DOC_WARNINGS" ] && [ -z "$FLAKE_ERRORS" ]; then
            {
              echo "## ✅ Pre-commit checks passed"
              echo ""
              echo "All hooks finished successfully."
              echo ""
              section "Container image reference parity" "$IMAGE_PARITY_LOG"
              section "NPM / static vendor libraries" "$NPM_VENDOR_LOG"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## ⚠️ Pre-commit results"
            echo ""
            printf -- '- Exit code: %s\n' "$EXIT_CODE"
            printf -- '- Changes detected: %s\n' "$CHANGED"
            echo ""
            section "Log warnings" "$LOG_WARNINGS"
            section "Docstring warnings" "$DOC_WARNINGS"
            section "Flake8 errors" "$FLAKE_ERRORS"
            section "Container image reference parity" "$IMAGE_PARITY_LOG"
            section "NPM / static vendor libraries" "$NPM_VENDOR_LOG"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on original PR (sticky)
        if: steps.gate.outputs.run == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const changed = ${{ toJSON(steps.changes.outputs.changed) }} === "true";
            const exitCode = ${{ toJSON(steps.hooks.outputs.exit_code) }};
            const logWarnings = ${{ toJSON(steps.hooks.outputs.log_warnings || '') }};
            const docWarnings = ${{ toJSON(steps.hooks.outputs.doc_warnings || '') }};
            const flakeErrors = ${{ toJSON(steps.hooks.outputs.flake_errors || '') }};
            const imageParityLog = ${{ toJSON(steps.hooks.outputs.image_parity_log || '') }};
            const npmVendorLog = ${{ toJSON(steps.hooks.outputs.npm_vendor_log || '') }};
            const runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}";
            const marker = "<!-- precommit-bot-comment -->";

            const cleanRun =
              exitCode === "0" &&
              !changed &&
              (!logWarnings || !logWarnings.trim()) &&
              (!docWarnings || !docWarnings.trim()) &&
              (!flakeErrors || !flakeErrors.trim());

            let body;

            if (cleanRun) {
              let hookLogBlocks = "";
              if (imageParityLog && imageParityLog.trim()) {
                hookLogBlocks += `\n\n### Container image reference parity\n\n\`\`\`\n${imageParityLog}\n\`\`\`\n`;
              }
              if (npmVendorLog && npmVendorLog.trim()) {
                hookLogBlocks += `\n\n### NPM / static vendor libraries\n\n\`\`\`\n${npmVendorLog}\n\`\`\`\n`;
              }
              body = `${marker}
            ## ✅ Pre-commit checks passed

            All pre-commit hooks finished successfully and no flake/doc/log warnings were detected.${hookLogBlocks}
            - Workflow run: [View logs](${runUrl})
            `;
            } else {

              const sections = [];

              if (logWarnings && logWarnings.trim()) {
                sections.push(`### Log warnings\n\`\`\`\n${logWarnings}\n\`\`\``);
              }

              if (docWarnings && docWarnings.trim()) {
                sections.push(`### Docstring warnings\n\`\`\`\n${docWarnings}\n\`\`\``);
              }

              if (flakeErrors && flakeErrors.trim()) {
                sections.push(`### Flake8 errors\n\`\`\`\n${flakeErrors}\n\`\`\``);
              }

              if (imageParityLog && imageParityLog.trim()) {
                sections.push(`### Container image reference parity\n\`\`\`\n${imageParityLog}\n\`\`\``);
              }

              if (npmVendorLog && npmVendorLog.trim()) {
                sections.push(`### NPM / static vendor libraries\n\`\`\`\n${npmVendorLog}\n\`\`\``);
              }

              body = `${marker}
            ## ⚠️ Pre-commit results

            - Exit code: ${exitCode}
            - Changes detected: ${changed}
            - Workflow run: [View logs](${runUrl})

            ${sections.join("\n\n")}
            `;
            }

            body = body.replace(/^[ \t]+/gm, '');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(
              c => c.user.type === "Bot" && c.body && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

      - name: Fail if pre-commit failed without auto-fix PR
        if: steps.gate.outputs.run == 'true' && steps.hooks.outputs.exit_code != '0' && steps.changes.outputs.changed != 'true'
        env:
          EXIT_CODE: ${{ steps.hooks.outputs.exit_code }}
        run: |
          echo "Pre-commit exited with $EXIT_CODE and no fix PR was generated."
          exit 1

  refresh-python-pins:
    # Obnova tranzitivních pinů po každém pushi do main (merge test → main, commit CITATION.cff
    # z release workflow) nebo ručně. Pracuje nad větví test a udržuje jeden průběžný PR do test,
    # takže aktualizace projdou běžným testovacím cyklem (viz CONTRIBUTING.md). Dependabot
    # pokrývá přímé závislosti z requirements*.in a bezpečnostní opravy.
    #
    # Job-level `if` by ponechal požadovaný check ve stavu skipped, který ruleset vyhodnocuje
    # jako nesplněný (PR zůstane BLOCKED). Job proto běží vždy a vlastní práci řídí krok `gate`.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Decide whether to refresh pins
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          UPGRADE_INPUT: ${{ inputs.upgrade_python_pins }}
        run: |
          if { [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; } || \
             { [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$UPGRADE_INPUT" = "true" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout test
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          ref: test
          persist-credentials: false

      - name: Upgrade compiled Python requirements
        if: steps.gate.outputs.run == 'true'
        run: bash scripts/compile_requirements.sh --upgrade

      # PR zakládá GitHub App token, aby jeho události spouštěly navazující workflows
      # (GITHUB_TOKEN vytvořené PR běhy nespouští).
      - name: Log-in as AMCR app
        if: steps.gate.outputs.run == 'true'
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.AISCR_AMCR_ACTIONS_CLIENT_ID }}
          private-key: ${{ secrets.AISCR_AMCR_ACTIONS_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Publish refresh branch and PR
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git checkout -B deps/python-pins-refresh
          git add -A
          if git diff --cached --quiet; then
            echo "No pin changes to publish."
            exit 0
          fi
          git commit -m "chore(deps): refresh compiled Python pins"
          gh auth setup-git
          git push --force origin deps/python-pins-refresh

          cat > "${RUNNER_TEMP}/pins-pr-body.md" <<'EOF'
          This PR was automatically generated by CI (`refresh-python-pins` in `pre_commit.yml`).

          It runs `scripts/compile_requirements.sh --upgrade` on `test`: direct pins in
          `webclient/requirements*.in` stay as they are, transitive pins in the compiled
          `webclient/requirements*.txt` move to the newest compatible versions.

          The PR is updated on every push to `main` until it is merged.
          EOF

          pr_number="$(gh pr list --head deps/python-pins-refresh --repo "$GITHUB_REPOSITORY" --json number --jq '.[0].number')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "Refresh compiled Python pins" --body-file "${RUNNER_TEMP}/pins-pr-body.md"
          else
            gh pr create --base test --head deps/python-pins-refresh \
              --title "Refresh compiled Python pins" --body-file "${RUNNER_TEMP}/pins-pr-body.md" \
              --label dependencies
          fi
