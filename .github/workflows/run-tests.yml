name: Run tests

permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:
    inputs:
      test_mod:
        description: 'Způsob testování'
        required: true
        type: choice
        options:
          - vsechny
          - neuspesne
          - konkretni
        default: vsechny

      test_cislo:
        description: 'Číslo testu (použij jen pokud zvolen režim "konkretni")'
        required: false
        type: string

      nasadit_verzi:
        description: 'Nasadit aktuální verzi před testováním'
        required: false
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.repository }}-DEV
  cancel-in-progress: false

env:
  server_deploy_root: /home/amcr/aiscr-webamcr
  dep_script: scripts/ci_deployment/deploy_test_server.sh
  test_script: scripts/start_selenium_tests.sh
  test_attempt: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  deployment:
    name: Run test on DEV server
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Validate test inputs
        id: validate-inputs
        shell: bash
        env:
          NASADIT: ${{ inputs.nasadit_verzi }}
          TEST_MOD: ${{ inputs.test_mod }}
          TEST_CISLO: ${{ inputs.test_cislo }}
        run: |
          set -euo pipefail
          case "$TEST_MOD" in
            vsechny|neuspesne|konkretni) ;;
            *) echo "::error::Invalid test mode"; exit 1 ;;
          esac
          case "$NASADIT" in
            true|false) ;;
            *) echo "::error::Invalid deployment boolean"; exit 1 ;;
          esac
          if [[ -n "$TEST_CISLO" && ! "$TEST_CISLO" =~ ^[0-9]+$ ]]; then
            echo "::error::Test number must contain decimal digits"
            exit 1
          fi
          if [[ "$TEST_MOD" == konkretni && -z "$TEST_CISLO" ]]; then
            echo "::error::Missing test number"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install OpenVPN
        run: |
          sudo apt-get update
          sudo apt-get --assume-yes --no-install-recommends install openvpn iputils-ping dnsutils          

      - name: Setup VPN config
        run: |
          echo "${{ secrets.VPN_CA_CRT }}" > .github/vpn/openvpn20_huldio_ci_ca.crt
          echo "${{ secrets.VPN_USER_CRT }}" > .github/vpn/openvpn20_huldio_ci_user.crt
          echo "${{ secrets.VPN_USER_KEY }}" > .github/vpn/openvpn20_huldio_ci_user.key
          echo "${{ secrets.VPN_SECRET_USERNAME_PASSWORD }}" > secret.txt

      - name: Connect VPN
        run: sudo openvpn --config ".github/vpn/openvpn20_huldio_ci.ovpn" --daemon --askpass secret.txt

      - name: Wait for VPN & DNS resolve
        shell: bash
        timeout-minutes: 2
        run: |
          for i in {1..10}; do
            if ping -c 1 ${{ secrets.DEPLOYMENT_SERVER_DEV }}; then
              break
            fi
            sleep 3
          done
          if ! ping -c 1 ${{ secrets.DEPLOYMENT_SERVER_DEV }}; then
            echo "::error::VPN connection failed"
            exit 1
          fi

      - name: Setup SSH agent
        id: ssh-agent
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_SERVER_DEV }}
        run: |
          set -euo pipefail
          agent_environment="$(ssh-agent -s)"
          eval "$agent_environment" > /dev/null
          trap 'ssh-agent -k > /dev/null 2>&1 || true' EXIT
          if ! printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null 2>&1; then
            echo "::error::Unable to load the DEV SSH key"
            exit 1
          fi
          printf 'SSH_AUTH_SOCK=%s\nSSH_AGENT_PID=%s\n' "$SSH_AUTH_SOCK" "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          trap - EXIT

      - name: SSH deployment a testy
        shell: bash
        env:
          NASADIT: ${{ inputs.nasadit_verzi }}
          TEST_MOD: ${{ inputs.test_mod }}
          TEST_CISLO: ${{ inputs.test_cislo }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SERVER_ROOT: ${{ env.server_deploy_root }}
          DEP_SCRIPT: ${{ env.dep_script }}
          TEST_SCRIPT: ${{ env.test_script }}
          ATTEMPT_ID: ${{ env.test_attempt }}
          DEPLOYMENT_SERVER: ${{ secrets.DEPLOYMENT_SERVER_DEV }}
          SSH_KNOWN_HOST: ${{ secrets.SSH_KNOWN_HOST_DEV }}
        run: |
          set -euo pipefail
          # Pre-fill known_hosts once
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOST" >> ~/.ssh/known_hosts
          
          # Quote arguments for the remote login shell; keep the script itself static.
          source "$GITHUB_WORKSPACE/scripts/ssh_arguments.sh"
          remote_command="$(ssh_command "$NASADIT" "$TEST_MOD" "$TEST_CISLO" "$REF_NAME" "$REF_TYPE" "$SERVER_ROOT" "$DEP_SCRIPT" "$TEST_SCRIPT" "$ATTEMPT_ID")"
          ssh "amcr@$DEPLOYMENT_SERVER" "$remote_command" <<'EOF'
              set -euo pipefail
              NASADIT="$1"
              TEST_MOD="$2"
              TEST_CISLO="$3"
              REF_NAME="$4"
              REF_TYPE="$5"
              SERVER_ROOT="$6"
              DEP_SCRIPT="$7"
              TEST_SCRIPT="$8"
              export AMCR_TEST_ATTEMPT_ID="$9"
              [[ "$AMCR_TEST_ATTEMPT_ID" =~ ^[0-9]+-[0-9]+$ ]] || exit 1
              cd "$SERVER_ROOT"
              chmod +x "$DEP_SCRIPT" "$TEST_SCRIPT"
              if [ "$NASADIT" = true ]; then
                "./$DEP_SCRIPT" "$SERVER_ROOT" "$REF_NAME" "$REF_TYPE" < /dev/null
              fi
              echo "Spouštím testy v režimu: $TEST_MOD"              
              if [ "$TEST_MOD" = "konkretni" ] && [ -z "$TEST_CISLO" ]; then
                echo "Missing test number"
                exit 1
              fi
              case $TEST_MOD in
                vsechny)
                echo "Testuji vše"
                "./$TEST_SCRIPT" < /dev/null
                ;;
                neuspesne)
                echo "Testuji pouze neúspěšné"
                "./$TEST_SCRIPT" -f < /dev/null
                ;;
                konkretni)
                echo "Testuji test č. $TEST_CISLO"
                "./$TEST_SCRIPT" -t "$TEST_CISLO" < /dev/null ;;
                *) exit 1 ;;
              esac
          EOF
          

      - name: Stáhnout a zobrazit výsledky testů
        id: test-result
        if: ${{ always() && !cancelled() && steps.ssh-agent.outcome == 'success' }}
        shell: bash
        env:
          ATTEMPT_ID: ${{ env.test_attempt }}
          TEST_MOD: ${{ inputs.test_mod }}
          TEST_CISLO: ${{ inputs.test_cislo }}
          DEPLOYMENT_SERVER: ${{ secrets.DEPLOYMENT_SERVER_DEV }}
        run: |
          set -euo pipefail
          [[ "$ATTEMPT_ID" =~ ^[0-9]+-[0-9]+$ ]] || exit 1
          result_dir="./test-results/$ATTEMPT_ID"
          remote_dir="/opt/selenium_test/runs/$ATTEMPT_ID"
          mkdir -p ./test-results
          mkdir "$result_dir"
          scp "amcr@$DEPLOYMENT_SERVER:$remote_dir/outcome.json" "$result_dir/outcome.json"
          download_plan="$(mktemp "$RUNNER_TEMP/amcr-download-plan.XXXXXX")"
          trap 'rm -f -- "$download_plan"' EXIT
          python3 "$GITHUB_WORKSPACE/scripts/collect_test_results.py" plan "$result_dir" \
            --attempt-id "$ATTEMPT_ID" --mode "$TEST_MOD" --number "$TEST_CISLO" > "$download_plan"
          while IFS= read -r result_file; do
            scp "amcr@$DEPLOYMENT_SERVER:$remote_dir/$result_file" "$result_dir/$result_file"
          done < "$download_plan"
          python3 "$GITHUB_WORKSPACE/scripts/collect_test_results.py" report "$result_dir" \
            --attempt-id "$ATTEMPT_ID" --mode "$TEST_MOD" --number "$TEST_CISLO"

      - name: Nahrát výsledky testů jako artifact
        if: ${{ always() && steps.test-result.outputs.ARTIFACTS == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selenium-vysledky
          path: ./test-results/${{ env.test_attempt }}/

      - name: Stop SSH agent
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${SSH_AGENT_PID:-}" && -n "${SSH_AUTH_SOCK:-}" ]]; then
            ssh-agent -k > /dev/null 2>&1 || true
          fi

      - name: Disconnect VPN
        if: always()
        run: |
          sudo pkill openvpn || true
