name: Deployment to selected environment
permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:
    inputs:
      tag:
       description: 'Version tag for deployment (accepts "1.0.0" or "v1.0.0"; Docker images use "1.0.0")'
       type: string
       required: true
      environment:
        description: 'Environment'
        type: choice
        options:
          - DEV
          - TEST
        required: true
        default: TEST
      source:
        description: 'Docker image source'
        type: choice
        options:
          - GitHub
          - DockerHub
        required: true
        default: GitHub 

concurrency:
  group: deploy-${{ github.repository }}-${{ inputs.environment }}
  cancel-in-progress: false

env:
  server_deploy_root: /home/amcr/aiscr-webamcr
  dep_script: scripts/ci_deployment/deploy_server.sh

jobs:
  deployment:
    name: Deploy to ${{ inputs.environment }} Server
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_SERVER: ${{ inputs.environment == 'DEV' && secrets.DEPLOYMENT_SERVER_DEV || inputs.environment == 'TEST' && secrets.DEPLOYMENT_SERVER_TEST }}
      SSH_KNOWN_HOST: ${{ inputs.environment == 'DEV' && secrets.SSH_KNOWN_HOST_DEV || inputs.environment == 'TEST' && secrets.SSH_KNOWN_HOST_TEST }}
    
    steps:
      - name: Normalize deployment tag
        id: normalize-tag
        shell: bash
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          raw_tag="$RAW_TAG"
          if [[ ! "$raw_tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid deployment tag '$raw_tag'. Expected 1.2.3 or v1.2.3."
            exit 1
          fi

          image_tag="${raw_tag#v}"
          git_tag="v${image_tag}"

          echo "git_tag=${git_tag}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.normalize-tag.outputs.git_tag }}
          fetch-depth: 0
    
      - name: Install OpenVPN
        run: |
          sudo apt-get update
          sudo apt-get --assume-yes --no-install-recommends install openvpn iputils-ping dnsutils          

      - name: Setup VPN config
        run: |
          echo "${{ secrets.VPN_CA_CRT }}" > .github/vpn/openvpn20_huldio_ci_ca.crt
          echo "${{ secrets.VPN_USER_CRT }}" > .github/vpn/openvpn20_huldio_ci_user.crt
          echo "${{ secrets.VPN_USER_KEY }}" > .github/vpn/openvpn20_huldio_ci_user.key
          echo "${{ secrets.VPN_SECRET_USERNAME_PASSWORD }}" > secret.txt

      - name: Connect VPN
        run: sudo openvpn --config ".github/vpn/openvpn20_huldio_ci.ovpn" --daemon --askpass secret.txt

      - name: Wait for VPN & DNS resolve
        shell: bash
        timeout-minutes: 2
        run: |
          for i in {1..10}; do
            if ping -c 1 ${{ env.DEPLOYMENT_SERVER }}; then
              break
            fi
            sleep 3
          done
          if ! ping -c 1 ${{ env.DEPLOYMENT_SERVER }}; then
            echo "::error::VPN connection failed"
            exit 1
          fi

      - name: SSH connection
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ inputs.environment == 'DEV' && secrets.SSH_PRIVATE_KEY_SERVER_DEV || inputs.environment == 'TEST' && secrets.SSH_PRIVATE_KEY_SERVER_TEST }}
          GIT_TAG: ${{ steps.normalize-tag.outputs.git_tag }}
          IMAGE_TAG: ${{ steps.normalize-tag.outputs.image_tag }}
          SERVER_ROOT: ${{ env.server_deploy_root }}
          DEP_SCRIPT: ${{ env.dep_script }}
          DEPLOYMENT_SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          agent_environment="$(ssh-agent -s)"
          eval "$agent_environment" > /dev/null
          trap 'ssh-agent -k > /dev/null 2>&1 || true' EXIT
          if ! printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null 2>&1; then
            echo "::error::Unable to load the deployment SSH key"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          for i in {1..10}; do
            if ping -c 1 "$DEPLOYMENT_SERVER"; then break; fi
            sleep 3
          done
          source "$GITHUB_WORKSPACE/scripts/ssh_arguments.sh"
          remote_command="$(ssh_command "$GIT_TAG" "$IMAGE_TAG" "$SERVER_ROOT" "$DEP_SCRIPT" "$DEPLOYMENT_SOURCE")"
          ssh "amcr@$DEPLOYMENT_SERVER" "$remote_command" <<'EOF'
          set -euo pipefail
          GIT_TAG="$1"
          IMAGE_TAG="$2"
          SERVER_ROOT="$3"
          DEP_SCRIPT="$4"
          DEPLOYMENT_SOURCE="$5"
          cd "$SERVER_ROOT"
          git fetch --all --tags --force          
          if ! git rev-parse "refs/tags/$GIT_TAG" >/dev/null 2>&1; then
            echo "ERROR: Tag $GIT_TAG does not exist"
            git tag -l
            exit 1
          fi          
          git checkout -f "refs/tags/$GIT_TAG"
          chmod +x "$DEP_SCRIPT"
          "./$DEP_SCRIPT" "$IMAGE_TAG" "$SERVER_ROOT" "$DEPLOYMENT_SOURCE"
          EOF

      - name: Disconnect VPN
        if: always()
        run: |
          sudo pkill openvpn || true
