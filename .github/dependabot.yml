# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Python: autorské webclient/requirements*.in se kompilují (pip-tools) do requirements*.txt.
  # Dependabot nespouští scripts/compile_requirements.sh, kompiluje vlastním pip-compile:
  # - přepínače (např. --strip-extras) čte z hlavičky vygenerovaného .txt,
  # - pořadí vrstev (prod → test → dev, prod → docs) zná jen z řádků -r v .in souborech.
  # Aktualizuje přímé závislosti z .in a bezpečnostní opravy; tranzitivní piny obnovuje
  # job refresh-python-pins v .github/workflows/pre_commit.yml (PR do test).
  - package-ecosystem: "pip"
    directory: "/webclient/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 30
    target-branch: test

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 30
    target-branch: test
    
  - package-ecosystem: "docker"
    directories:
      - "/" 
      - "/fedora/"
      - "/redis/"
      - "/proxy/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 30
    target-branch: test
    
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 30
    target-branch: test
    groups:
      elastic-stack:
        patterns:
          - "elasticsearch/elasticsearch"
          - "kibana/kibana"
          - "logstash/logstash"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 30
    target-branch: test

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 30
    target-branch: test 
